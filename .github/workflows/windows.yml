name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Require tag and project version to agree
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [xml]$project = Get-Content src/Qingyue.Desktop/EpubKindleFix.csproj -Raw
          $expected = 'v' + [string]$project.Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -cne $expected) { throw "Tag must equal $expected" }
      - name: Publish Windows package and source archive
        shell: pwsh
        run: ./scripts/publish.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: qingyue-windows-${{ github.run_number }}
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Create versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; refusing to overwrite.' }
          $assets = @(Get-ChildItem artifacts -File | Where-Object { $_.Extension -eq '.zip' -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --verify-tag --title "轻阅 $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed.' }
