    id: version
    attributes:
      label: 轻阅版本和 Windows 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤、实际结果与预期结果
      description: 请勿填写邮箱授权码、密码、Cookie 或完整个人配置。
    validations:
      required: true
